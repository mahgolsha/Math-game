<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی جمع تا ۵ 🌟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .stars-count {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        .title {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .question {
            font-size: 48px;
            color: #333;
            margin: 30px 0;
            font-weight: bold;
            direction: ltr;
        }

        .visual {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .visual-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .item {
            font-size: 40px;
            animation: pop 0.5s ease;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .plus-sign {
            font-size: 48px;
            color: #667eea;
            font-weight: bold;
        }

        .answers {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .answer-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 25px;
            font-size: 36px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .answer-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.6);
        }

        .answer-btn:active {
            transform: translateY(-2px);
        }

        .answer-btn.correct {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            animation: correctPulse 0.6s ease;
        }

        .answer-btn.wrong {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            animation: shake 0.5s ease;
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .message {
            font-size: 28px;
            margin: 20px 0;
            font-weight: bold;
            min-height: 40px;
            transition: all 0.3s ease;}

        .message.success {
            color: #11998e;
        }

        .message.error {
            color: #eb3349;
        }

        .next-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
            transition: all 0.3s ease;
            display: none;
        }

        .next-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.6);
        }

        .star-animation {
            position: fixed;
            font-size: 40px;
            pointer-events: none;
            animation: starFly 1s ease-out forwards;
            z-index: 1000;
        }

        @keyframes starFly {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0.5) rotate(360deg);
                opacity: 0;
            }
        }

        .sound-btn {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border: none;
            padding: 10px 20px;
            font-size: 24px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(252, 182, 159, 0.4);
            transition: all 0.3s ease;
        }

        .sound-btn:hover {
            transform: scale(1.1);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            .title {
                font-size: 24px;
            }
            .question {
                font-size: 36px;
            }
            .answer-btn {
                padding: 20px;
                font-size: 28px;
            }
            .item {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="stars-count">⭐ <span id="stars">0</span></div>
            <button class="sound-btn" onclick="speakQuestion()">🔊</button>
        </div>
        
        <h1 class="title">بازی جمع تا ۵</h1>
        
        <div class="visual" id="visual"></div>
        
        <div class="question" id="question"></div>
        
        <div class="answers" id="answers"></div>
        
        <div class="message" id="message"></div>
        
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">سوال بعدی ➡️</button>
    </div>

    <script>
        let stars = 0;
        let currentQuestion = {};
        let attempts = 0;
        const emojis = ['🍎', '🌟', '🎈', '🍭', '🦋', '🌸', '🐝', '🎨'];
        const encouragements = [
            'آفرین قهرمان! 🎉',
            'خیلی باهوشی! 🌟',
            'دست مریزاد! 👏',
            'عالی بود! 💪',
            'کارت درسته! ✨',
            'محشری! 🏆',
            'فوق‌العاده‌ای! 🎊'
        ];
        const hints = [
            'یه بار دیگه فکر کن، تو می‌تونی! 💭',
            'نزدیک بودی، دوباره تلاش کن! 🌈',
            'آروم بشمار، حتماً پیداش می‌کنی! 🔍'
        ];

        function generateQuestion() {
            const num1 = Math.floor(Math.random() * 5) + 1;
            const num2 = Math.floor(Math.random() * (6 - num1));
            const answer = num1 + num2;
            
            currentQuestion = { num1, num2, answer };
            attempts = 0;
            
            displayQuestion();
            displayVisual();
            displayAnswers(answer);
            document.getElementById('message').textContent = '';
            document.getElementById('message').className = 'message';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function displayQuestion() {
            const { num1, num2 } = currentQuestioln;document.getElementById('question').textContent = ${num1} + ${num2} = ?;
        }

        function displayVisual() {
            const { num1, num2 } = currentQuestion;
            const emoji = emojis[Math.floor(Math.random() * emojis.length)];
            const visual = document.getElementById('visual');
            
            let html = '<div class="visual-group">';
            for (let i = 0; i < num1; i++) {
                html += <span class="item">${emoji}</span>;
            }
            html += '</div><span class="plus-sign">+</span><div class="visual-group">';
            for (let i = 0; i < num2; i++) {
                html += <span class="item">${emoji}</span>;
            }
            html += '</div>';
            
            visual.innerHTML = html;
        }

        function displayAnswers(correctAnswer) {
            const answers = document.getElementById('answers');
            const options = new Set([correctAnswer]);
            
            while (options.size < 6) {
                const random = Math.floor(Math.random() * 11);
                if (random !== correctAnswer) {
                    options.add(random);
                }
            }
            
            const shuffled = Array.from(options).sort(() => Math.random() - 0.5);
            
            answers.innerHTML = shuffled.map(num => 
                <button class="answer-btn" onclick="checkAnswer(${num}, this)">${num}</button>
            ).join('');
        }

        function checkAnswer(selected, button) {
            const { answer } = currentQuestion;
            const message = document.getElementById('message');
            
            if (selected === answer) {
                button.classList.add('correct');
                stars++;
                document.getElementById('stars').textContent = stars;
                
                const encouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
                message.textContent = encouragement;
                message.className = 'message success';
                
                createStarAnimation(button);
                playSound('correct');
                
                document.getElementById('nextBtn').style.display = 'inline-block';
                
                disableAllButtons();
            } else {
                button.classList.add('wrong');
                attempts++;
                
                if (attempts < 2) {
                    const hint = hints[Math.floor(Math.random() * hints.length)];
                    message.textContent = hint;
                    message.className = 'message error';
                    
                    setTimeout(() => {
                        button.classList.remove('wrong');
                    }, 500);
                } else {
                    message.textContent = جواب درست ${answer} بود. دفعه بعد حتماً می‌تونی! 💪;
                    message.className = 'message error';
                    document.getElementById('nextBtn').style.display = 'inline-block';
                    disableAllButtons();
                }
                
                playSound('wrong');
            }
        }

        function disableAllButtons() {
            document.querySelectorAll('.answer-btn').forEach(btn => {
                btn.disabled = true;
                btn.style.opacity = '0.6';
                btn.style.cursor = 'not-allowed';
            });
        }

        function nextQuestion() {
            generateQuestion();
        }

        function createStarAnimation(element) {
            const rect = element.getBoundingClientRect();
            const star = document.createElement('div');
            star.className = 'star-animation';
            star.textContent = '⭐';
            star.style.left = rect.left + rect.width / 2 + 'px';
            star.style.top = rect.top + rect.height / 2 + 'px';
            
            const targetX = (Math.random() - 0.5) * 200;
            const targetY = -300 - Math.random() * 200;star.style.setProperty('--tx', targetX + 'px');
            star.style.setProperty('--ty', targetY + 'px');
            
            document.body.appendChild(star);
            
            setTimeout(() => star.remove(), 1000);
        }

        function playSound(type) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            if (type === 'correct') {
                oscillator.frequency.value = 523.25;
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            } else {
                oscillator.frequency.value = 200;
                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.2);
            }
        }

        function speakQuestion() {
            const { num1, num2 } = currentQuestion;
            const text = ${num1} به علاوه ${num2} میشه چند؟;
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fa-IR';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            }
        }

        // شروع بازی
        generateQuestion();
    </script>
</body>
</html>
